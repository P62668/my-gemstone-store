name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (ignore postinstall scripts)
        run: npm ci --ignore-scripts
      - name: Run Prisma migrations and generate client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: sh scripts/prisma-deploy.sh
      - name: Seed production (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ALLOW_PROD_SEED: '1'
        run: ADMIN_PASSWORD="$ADMIN_PASSWORD" ALLOW_PROD_SEED=1 NODE_ENV=production node prisma/seed.js
      - name: Build
        run: npm run build
      - name: Deploy (Vercel example)
        run: echo 'Deploy step here - use vercel/cli or your own provider'
